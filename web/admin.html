<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate and Save License Key</title>
    <link rel="stylesheet" type="text/css" href="estilos/adminstyle.css">
    <link rel="icon" href="estilos/imagens/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="navigation-container">
        <div class="navigation-menu">
            <button class="BotaoNavigation" id="btnEdit">License Editor</button>
            <button class="BotaoNavigation" id="btnLicenseList">License List</button>
            <button class="BotaoNavigation" id="btnMassGenerator">Mass Generator</button>
            <button class="BotaoNavigation" id="btnUserList">User List</button>
            <button class="BotaoNavigation" id="btnUserEditor">User Editor</button>
            <button class="BotaoNavigation" id="btnSoftware">Software Data</button>
        </div>
    </div>
    <div class="container">
        <img src="estilos/imagens/adminlogo.png" alt="Logo">
        <div id="UserName"></div>
        <div class="input-container">
            <input type="text" id="SearchLicense" name="searchLicense" class="search-input" placeholder="Search License Key">
            <button id="SearchButton" name="searchButton" class="button-icon">🔍</button>
        </div>
        <div class="input-container">
            <input type="text" id="LicenseKey" name="licenseKey" placeholder="License Key" readonly>
            <button id="GenerateLicense" name="generateLicense" class="button-icon">🔑</button>
            
        </div>
        <div class="input-container">
            <select id="LicenseDurationField" name="productIDField" style="margin-right: 10px;"> 
                <option value="24 hours">24 hours</option>
                <option value="7 days">7 days</option>
                <option value="30 days">30 days</option>
                <option value="Lifetime">Lifetime</option>
            </select>
            <input type="text" id="LicenseExpiration" name="licenseExpiration" placeholder="Expiration Date">
        </div>
        <div class="input-container">
            <input type="text" id="ExtraInfo" name="extraInfo" placeholder="Extra Info">
        </div>
        <div class="toggle-switch">
            <label class="switch">
                <input type="checkbox" id="licenseActivatedToggle">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="button-container">
            <button id="SaveLicense" name="saveLicense" class="button-icon">💾 Save</button>
    <button id="RemoveLicense" name="removeLicense" class="button-icon">🗑️ Remove</button>

        </div>
    </div>

    <!-- Pop-up -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="popup-close" id="popup-close">&times;</span>
            <p id="popup-message"></p>
        </div>
    </div>
   
    <script type="module" src="scripts/admin-javascript.js"></script>
</body>
</html>
